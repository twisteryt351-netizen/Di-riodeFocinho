name: Robo de Cuidados com Pets

on:
  schedule:
    - cron: '0 12 * * *'  # Executará 1 vez por dia de forma 100% automática às 09:00 BRT
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias oficiais
        run: pip install requests groq google-auth

      - name: Executar script correto
        run: python robo_final.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_ID_PETS: ${{ secrets.BLOGGER_ID_PETS }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
